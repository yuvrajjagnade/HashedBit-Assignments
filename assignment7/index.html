<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL 2022 Points Table</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      background: #f8fafc;
      padding: 20px;
    }

    .wrapper {
      width: min(960px, 100%);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 14px;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    select, label {
      font-size: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    th, td {
      border: 1px solid #cbd5e1;
      padding: 8px;
    }

    thead {
      background: #e2e8f0;
    }

    tr.top-four {
      background: #dcfce7;
    }

    #status {
      margin-top: 10px;
      text-align: center;
      color: #475569;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <h2>IPL Season 2022 - Points Table</h2>

    <div class="controls">
      <label for="sortBy">Sort by:</label>
      <select id="sortBy">
        <option value="points">Points (High to Low)</option>
        <option value="nrr">NRR (High to Low)</option>
        <option value="team">Team (A-Z)</option>
      </select>

      <label>
        <input type="checkbox" id="highlightTop4" checked>
        Highlight Top 4
      </label>
    </div>

    <table id="pointsTable">
      <thead>
        <tr>
          <th>No</th>
          <th>Team</th>
          <th>Matches</th>
          <th>Won</th>
          <th>Lost</th>
          <th>Tied</th>
          <th>NRR</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p id="status">Loading teams...</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
